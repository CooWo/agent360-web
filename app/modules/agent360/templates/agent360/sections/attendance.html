<section class="card">
  <h2>근태 · 최근 {{ cfg.attendance_days }}일 <span class="muted small">결근 {{ attendance.absent }} · 지각 {{ attendance.late }} · 연차 {{ attendance.leave }}</span></h2>
  <div class="att-strip">
    {% for d in attendance.days %}<span class="att {{ d.status }}" title="{{ d.date }} {{ d.status }}"></span>{% endfor %}
  </div>
  <div class="legend"><span><i style="background:var(--att-ok)"></i>정상</span><span><i style="background:var(--att-absent)"></i>결근</span>
    <span><i style="background:var(--att-late)"></i>지각</span><span><i style="background:var(--att-leave)"></i>연차</span></div>
</section>
