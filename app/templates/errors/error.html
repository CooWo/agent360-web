{% extends "base.html" %}
{% block title %}{{ status }} · {{ app_title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
  <h1>{{ '권한이 없습니다' if status == 403 else ('찾을 수 없습니다' if status == 404 else '요청을 처리하지 못했습니다') }}</h1>
  <p class="muted">{{ message }}</p>
  <p><a class="btn" href="/">처음으로</a></p>
</div>
{% endblock %}
